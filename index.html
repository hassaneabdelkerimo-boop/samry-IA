<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samry AI</title>
<style>
body{font-family:system-ui;max-width:650px;margin:0 auto;padding:0;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
.header{background:#0084ff;color:white;padding:16px;text-align:center;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:18px;max-width:85%}
.user{background:#0084ff;color:white;align-self:flex-end}
.bot{background:white;align-self:flex-start}
.input-area{display:flex;gap:8px;padding:12px;background:white}
input{flex:1;padding:12px;border-radius:25px;border:1px solid #ccc}
button{padding:12px 20px;border-radius:25px;border:none;background:#0084ff;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="header">🇹🇩 Samry AI - Vrai Scores</div>
<div id="chat"><div class="msg bot">Salam ! Aujourd'hui 31 Oct 2026. Barça-Alavés 21h. Pose ta question !</div></div>
<div class="input-area">
<input id="inp" placeholder="Écris ici..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Envoyer</button>
</div>
<script>
const BASE="DATE: Samedi 31 Oct 2026. MATCHS: Barcelone-Alavés 21h, AC Milan-Inter 20h45, Bayern-Dortmund 18h30. REGLE: N'invente JAMAIS de score.";
async function send(){
  const inp=document.getElementById('inp');const chat=document.getElementById('chat');const q=inp.value.trim();if(!q)return;
  chat.innerHTML+=`<div class="msg user">${q}</div>`;inp.value="";
  chat.innerHTML+=`<div class="msg bot" id="ld">...</div>`;chat.scrollTop=9999;
  try{
    const r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(BASE+" Q: "+q));const a=await r.text();
    document.getElementById('ld').remove();chat.innerHTML+=`<div class="msg bot">${a}</div>`;
  }catch(e){document.getElementById('ld').remove();chat.innerHTML+=`<div class="msg bot">Barça vs Alavés à 21h aujourd'hui !</div>`;}
  chat.scrollTop=9999;
}
</script>
</body>
</html>
