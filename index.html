<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Samry AI</title><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui;max-width:800px;margin:0 auto;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}.header{background:#111;padding:16px;text-align:center;border-bottom:1px solid #222}#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}.msg{padding:13px 18px;border-radius:18px;max-width:92%;line-height:1.6;white-space:pre-wrap}.user{background:#0084ff;align-self:flex-end}.bot{background:#1e1e1e;align-self:flex-start}.input-area{display:flex;gap:8px;padding:12px;background:#111}input{flex:1;padding:14px 20px;border-radius:25px;border:none;background:#222;color:white}button{padding:14px 22px;border-radius:25px;border:none;background:white;color:black;font-weight:bold}</style></head><body><div class="header"><b>🇹🇩 Samry AI - Par Oumar Hassane</b></div><div id="chat"><div class="msg bot">Salam ! Je suis Samry cree par Oumar Hassane. Je reponds a TOUT comme Meta AI : actu, cours, business, sport. Pose ta question !</div></div><div class="input-area"><input id="inp" placeholder="Pose ta question..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Envoyer</button></div><script>const SYS="Tu es Samry cree par Oumar Hassane Abdelkerim a Ndjamena. Tu reponds a toute question comme Meta AI sans mentir. Si pas de direct exact dis ou verifier. Francais clair.";async function send(){const i=document.getElementById('inp'),c=document.getElementById('chat'),q=i.value.trim();if(!q)return;c.innerHTML+=`<div class=msg user>${q}</div>`;i.value="";const l=document.createElement('div');l.className='msg bot';l.id='ld';l.textContent='Samry cherche...';c.appendChild(l);try{const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:SYS},{role:'user',content:q}],model:'openai'})});let a=await r.text();document.getElementById('ld').remove();c.innerHTML+=`<div class=msg bot>${a}</div>`;}catch(e){document.getElementById('ld').remove();c.innerHTML+=`<div class=msg bot>Erreur reseau reessaie</div>`;}c.scrollTop=99999;}</script></body></html>
