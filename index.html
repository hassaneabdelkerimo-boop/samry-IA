<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Samry</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f9fafb;min-height:100vh;display:flex;flex-direction:column}.top{height:56px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 16px;gap:8px}.logo{width:32px;height:32px;background:#3b82f6;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold}.main{flex:1;max-width:700px;margin:0 auto;width:100%;padding:16px;display:flex;flex-direction:column}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.s{width:64px;height:64px;background:#3b82f6;border-radius:16px;display:flex;align-items:center;justify-content:center;color:white;font-size:28px;font-weight:bold}.cards{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;display:flex;gap:10px;cursor:pointer}#chat{display:none;flex-direction:column;gap:12px;flex:1;overflow-y:auto}.msg{padding:12px 16px;border-radius:16px;max-width:90%;white-space:pre-wrap;line-height:1.6;font-size:15px}.user{background:#3b82f6;color:white;align-self:flex-end}.bot{background:white;border:1px solid #e5e7eb;align-self:flex-start}.input-wrap{position:sticky;bottom:0;background:#f9fafb;padding:12px;border-top:1px solid #e5e7eb}.box{background:white;border:1px solid #e5e7eb;border-radius:24px;display:flex;padding:5px 5px 5px 16px}.box input{flex:1;border:none;outline:none}.box button{background:#3b82f6;color:white;border:none;width:36px;height:36px;border-radius:50%}</style></head><body><div class="top"><div class="logo">S</div><b>samry</b><span style="margin-left:auto;font-size:11px;color:#3b82f6">par Oumar Hassane</span></div><div class="main"><div id="welcome" class="center ata==='string'){a=data;}else{a=JSON.stringify(data);}document.getElementById('ld').remove();c.innerHTML+=`<div class=msg bot>${a}</div>`;}catch(e){document.getElementById('ld').remove();c.innerHTML+=`<div class=msg bot>Erreur reseau</div>`;}c.scrollTop=99999;}</script></body></html>
