<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samry AI - ERP PME Tchadiennes</title>
<style>
  body { font-family: sans-serif; background: #f0f2f5; margin:0; padding:0; display:flex; flex-direction:column; height:100vh; }
  header { background:#0a7a43; color:white; padding:15px; text-align:center; font-weight:bold; font-size:20px; }
  #chat { flex:1; overflow-y:auto; padding:15px; }
  .msg { margin:10px 0; padding:12px; border-radius:12px; max-width:80%; }
  .user { background:#0a7a43; color:white; margin-left:auto; }
  .samry { background:white; border:1px solid #ddd; }
  #inputArea { display:flex; padding:10px; background:white; border-top:1px solid #ccc; }
  #question { flex:1; padding:12px; border-radius:20px; border:1px solid #ccc; outline:none; }
  #btn { margin-left:10px; background:#0a7a43; color:white; border:none; padding:12px 20px; border-radius:20px; cursor:pointer; }
</style>
</head>
<body>

<header>🇹🇩 Samry AI - Créé par Oumar Hassane - Ndjamena</header>

<div id="chat">
  <div class="msg samry">Salam Oumar ! Je suis Samry AI, ton ERP intelligent pour PME tchadiennes. Je parle toutes les langues. Comment je peux t'aider aujourd'hui ?</div>
</div>

<div id="inputArea">
  <input id="question" placeholder="Écrivez votre message... Ex: Barcelone joue à quelle heure ?" />
  <button id="btn" onclick="envoyer()">Envoyer</button>
</div>

<script>
// --- PROMPT CORRIGÉ DE SAMRY ---
const PROMPT = `
Tu es Samry AI, un ERP intelligent pour les PME tchadiennes.
Tu as été créé par Oumar Hassane à Ndjamena, Tchad.
Tu parles TOUTES les langues. Tu détectes la langue et tu réponds dans la même langue.
Tu aides les entreprises tchadiennes.
`;

// --- FONCTION QUI RÉPOND SANS ERREUR RÉSEAU ---
async function repondre(question) {
  // Pour l'instant, version locale qui fonctionne sans API
  // Plus tard tu pourras remplacer par un vrai appel API
  
  const q = question.toLowerCase();
  
  if (q.includes("qui") && q.includes("créé")) {
    return "Je suis Samry AI, créé par Oumar Hassane à Ndjamena, Tchad. Un ERP intelligent pour les PME tchadiennes.";
  }
  if (q.includes("barcelone") || q.includes("championnat") || q.includes("match")) {
    const now = new Date().toLocaleString('fr-FR', {timeZone: 'Africa/Ndjamena'});
    return `Pour les matchs d'aujourd'hui (${now}), dis-moi quelle équipe tu veux suivre et je te donne l'heure exacte (heure de Ndjamena). Ex: Barcelone vs ?`;
  }
  if (q.includes("bonjour") || q.includes("salam")) {
    return "Salam ! Comment va le projet Samry IA à Ndjamena ? Je suis prêt à t'aider.";
  }
  
  // Réponse générique intelligente
  return `Samry AI a bien reçu : "${question}". Je suis en version locale pour l'instant. Pour avoir les vraies infos comme Meta AI (météo, foot, etc.), ajoute ta clé API dans le code. Mais je fonctionne déjà sans Erreur Réseau !`;
}

async function envoyer() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const question = input.value.trim();
  if (!question) return;

  // Affiche question user
  chat.innerHTML += `<div class="msg user">${question}</div>`;
  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  // Affiche "en train d'écrire"
  const id = Date.now();
  chat.innerHTML += `<div id="${id}" class="msg samry">Samry écrit...</div>`;
  chat.scrollTop = chat.scrollHeight;

  // Appelle la fonction corrigée
  const reponse = await repondre(question);
  
  document.getElementById(id).innerText = reponse;
  chat.scrollTop = chat.scrollHeight;
}

// Permet d'envoyer avec Entrée
document.getElementById("question").addEventListener("keypress", function(e){
  if(e.key === "Enter") envoyer();
});
</script>

</body>
</html>
