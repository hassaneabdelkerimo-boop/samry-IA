<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Samry - Google + Satellite</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#f9fafb;min-height:100vh;display:flex;flex-direction:column}.top{height:56px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.logo{display:flex;gap:8px;align-items:center;font-weight:600}.logo-icon{width:32px;height:32px;background:#3b82f6;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white}.main{flex:1;max-width:750px;margin:0 auto;width:100%;padding:16px;display:flex;flex-direction:column}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.s-logo{width:64px;height:64px;background:#3b82f6;border-radius:16px;display:flex;align-items:center;justify-content:center;color:white;font-size:28px;font-weight:bold}.cards{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:14px;display:flex;gap:10px;cursor:pointer}#chat{display:none;flex-direction:column;gap:12px;flex:1;overflow-y:auto}.msg{padding:12px 16px;border-radius:16px;max-width:92%;white-space:pre-wrap;line-height:1.5}.user{background:#3b82f6;color:white;align-self:flex-end}.bot{background:white;border:1px solid #e5e7eb;align-self:flex-start}.tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.tool{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid #e5e7eb;background:#fff;cursor:pointer}.tool:hover{background:#f3f4f6}.map-frame{width:100%;height:250px;border:none;border-radius:12px;margin-top:10px}.input-wrap{position:sticky;bottom:0;background:#f9fafb;padding:12px;border-top:1px solid #e5e7eb}.input-box{background:white;border:1px solid #e5e7eb;border-radius:24px;display:flex;padding:5px 5px 5px 16px;max-width:750px;margin:0 auto}.input-box input{flex:1;border:none;outline:none}.input-box button{background:#3b82f6;color:white;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer}</style></head><body><div class="top"><div class="logo"><div class="logo-icon">S</div>samry - Google + Satellite</div><div style="font-size:11px;color:#3b82f6">Créé par Oumar Hassane</div></div><div class="main"><div id="welcome" class="center"><div class="s-logo">S</div><h1 style="margin:12px 0">Bonjour, je suis <span style="color:#3b82f6">Samry.</span></h1><p style="color:#6b7280;font-size:14px">Maintenant je réponds avec Google et Satellite en direct.</p><div class="cards"><div class="card" onclick="setQ('N\'Djamena vue satellite')">🛰️ <div><b>Voir Satellite</b><br><span style="font-size:12px;color:#6b7280">Montre-moi N'Djamena en satellite</span></div></div><div class="card" onclick="setQ('Tchad population Google')">🔍 <div><b>Chercher sur Google</b><br><span style="font-size:12px;color:#6b7280">Population du Tchad sur Google</span></div></div><div class="card" onclick="setQ('Marché central Ndjamena')">📍 <div><b>Localiser sur carte</b><br><span style="font-size:12px;color:#6b7280">Où est le marché central ?</span></div></div></div></div><div id="chat"></div><div class="input-wrap"><div class="input-box"><input id="inp" placeholder="Demande : N'Djamena satellite, ou cherche sur Google..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">↑</button></div></div></div><script>const SYS="Tu es Samry cree par Oumar Hassane a Ndjamena, 31 oct 2026. Tu es connecte a Google et Satellite. Quand on demande lieu, donne coordonnees. Reponds en francais. Tu es Samry pas Meta.";function setQ(t){document.getElementById('inp').value=t;send();}function googleLink(q){return `https://www.google.com/search?q=${encodeURIComponent(q)}`;}function satelliteLink(q){return `https://www.google.com/maps/search/${encodeURIComponent(q)}/@12.1348,15.0557,14z/data=!3m1!1e3`; }async function send(){const i=document.getElementById('inp'),c=document.getElementById('chat'),w=document.getElementById('welcome'),q=i.value.trim();if(!q)return;w.style.display='none';c.style.display='flex';c.innerHTML+=`<div class=msg user>${q}</div>`;i.value='';const ld=document.createElement('div');ld.className='msg bot';ld.id='ld';ld.textContent='Samry cherche sur Google + Satellite...';c.appendChild(ld);try{const r=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:SYS},{role:'user',content:q}],model:'openai'})});let a=await r.text();document.getElementById('ld').remove();const isPlace = /ndjamena|tchad|moundou|sarh|abeche|marche|ville|village|pays|carte|satellite|ou est/i.test(q);let extra = `<div class=tools><a class=tool href='${googleLink(q)}' target=_blank>🔍 Voir sur Google</a><a class=tool href='${satelliteLink(q)}' target=_blank>🛰️ Vue Satellite</a></div>`;if(isPlace){extra+=`<iframe class=map-frame src='https://maps.google.com/maps?q=${encodeURIComponent(q)}&t=k&z=13&ie=UTF8&iwloc=&output=embed' loading=lazy></iframe>`;}c.innerHTML+=`<div class=msg bot>${a}${extra}</div>`;}catch(e){document.getElementById('ld').remove();c.innerHTML+=`<div class=msg bot>Erreur, mais tu peux voir : <a href='${googleLink(q)}' target=_blank>sur Google</a></div>`;}c.scrollTop=99999;}</script></body></html>
